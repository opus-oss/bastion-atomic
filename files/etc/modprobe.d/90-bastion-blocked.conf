# From modules/attack-surface.nix. On the NixOS build most of these were compiled out
# entirely, which is stronger than a blocklist -- absent code cannot be coaxed into
# loading. Until the device-only kernel lands here they are blocked the ordinary way,
# with an install override as well as a blacklist so an explicit modprobe also fails.
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc
blacklist n-hdlc
blacklist ax25
blacklist netrom
blacklist x25
blacklist rose
blacklist decnet
blacklist econet
blacklist af_802154
blacklist ipx
blacklist appletalk
blacklist psnap
blacklist p8023
blacklist p8022
blacklist can
blacklist atm
blacklist cramfs
blacklist freevxfs
blacklist jffs2
blacklist hfs
blacklist hfsplus
blacklist udf
blacklist cifs
blacklist nfs
blacklist nfsv3
blacklist nfsv4
blacklist ksmbd
blacklist gfs2
blacklist firewire-core
blacklist firewire-ohci
blacklist firewire-sbp2
blacklist ohci1394
blacklist sbp2
blacklist dv1394
blacklist raw1394
blacklist video1394
blacklist mei
blacklist mei-me
blacklist sp5100_tco
blacklist pcspkr
blacklist vivid
blacklist bluetooth
blacklist btusb
blacklist uvcvideo
blacklist thunderbolt

install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install n-hdlc /bin/false
install ax25 /bin/false
install netrom /bin/false
install x25 /bin/false
install rose /bin/false
install decnet /bin/false
install econet /bin/false
install af_802154 /bin/false
