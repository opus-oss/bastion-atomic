# NetworkManager stops handing DNS to dnsconfd/unbound and leaves /etc/resolv.conf alone, so the
# only resolver is dnscrypt-proxy on loopback. The servers a network offers over DHCP would be
# reached in plaintext on port 53, which the firewall rejects anyway.
#
# Named zz- because /etc/NetworkManager/conf.d is read in order and the installer leaves a
# dnsconfd.conf there with dns=dnsconfd: this has to sort after it to win.
[main]
dns=none
