# bastion-atomic replaces this service (DNS: dnscrypt-proxy; firewall: bastion-nftables; clock:
# bastion-timesync), so it does not start even when /etc still enables it -- which it does after a
# rebase from plain Silverblue, where the machine's own /etc wins the merge. To run it anyway:
#   run0 bash -c 'mkdir -p /etc/bastion && touch /etc/bastion/enable-firewalld'
[Unit]
ConditionPathExists=/etc/bastion/enable-firewalld
