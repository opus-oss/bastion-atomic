# Test ubuntu/install.sh: boot Ubuntu 26.04's cloud image in QEMU, run the installer twice (the
# second run must succeed on the already-hardened system, with DNS through dnscrypt-proxy), reboot
# so the kernel arguments and blocklist apply, then run ubuntu/tests/check.sh in the guest.
# Nothing is published. arm64 runners have no KVM, so that leg runs under TCG and is slow.
name: ubuntu

on:
  schedule:
    - cron: "0 10 * * 3"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ubuntu/**, files/**, .github/workflows/ubuntu.yml]

concurrency:
  group: ubuntu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      IMG: ubuntu-26.04-server-cloudimg-${{ matrix.arch }}.img
      BASE: https://cloud-images.ubuntu.com/releases/resolute/release
      SSH: ssh -p 2222 -i key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ServerAliveInterval=30 -o LogLevel=ERROR ubuntu@127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          if [ ${{ matrix.arch }} = amd64 ]; then
            sudo apt-get install -yq qemu-system-x86 qemu-utils cloud-image-utils
            sudo chmod 666 /dev/kvm
          else
            sudo apt-get install -yq qemu-system-arm qemu-efi-aarch64 qemu-utils cloud-image-utils
          fi

      - name: Cloud image
        run: |
          set -euo pipefail
          curl -fsSLO "$BASE/$IMG"
          curl -fsSL "$BASE/SHA256SUMS" | grep " \*$IMG\$" | sed 's/ \*/  /' | sha256sum -c -
          qemu-img create -f qcow2 -F qcow2 -b "$IMG" disk.qcow2 30G
          ssh-keygen -q -t ed25519 -N '' -f key
          cat > user-data <<EOF
          #cloud-config
          ssh_authorized_keys: ["$(cat key.pub)"]
          package_update: false
          EOF
          cloud-localds seed.img user-data

      - name: Boot
        run: |
          set -euo pipefail
          common=(-m 6144 -smp 4 -display none -serial file:serial.log -daemonize -pidfile qemu.pid
                  -drive file=disk.qcow2,if=virtio -drive file=seed.img,if=virtio,format=raw
                  -nic user,model=virtio-net-pci,hostfwd=tcp:127.0.0.1:2222-:22)
          if [ ${{ matrix.arch }} = amd64 ]; then
            qemu-system-x86_64 -machine q35,accel=kvm -cpu host "${common[@]}"
          else
            cp /usr/share/AAVMF/AAVMF_VARS.fd vars.fd
            qemu-system-aarch64 -machine virt -cpu max,pauth-impdef=on \
              -drive if=pflash,format=raw,readonly=on,file=/usr/share/AAVMF/AAVMF_CODE.fd \
              -drive if=pflash,format=raw,file=vars.fd "${common[@]}"
          fi
          for i in $(seq 180); do $SSH true 2>/dev/null && exit 0; sleep 10; done
          echo "no ssh after 30 minutes"; exit 1

      - name: Install (twice)
        run: |
          set -euo pipefail
          tar c files ubuntu | $SSH 'mkdir -p bastion && tar x -C bastion'
          $SSH 'sudo cloud-init status --wait >/dev/null || true'
          # Full output goes to an artifact; the log shows the section headers and the tail on failure.
          for run in 1 2; do
            if ! $SSH 'sudo bash bastion/ubuntu/install.sh' > install-$run.log 2>&1; then
              grep '^== ' install-$run.log; echo '--- last 60 lines'; tail -n 60 install-$run.log; exit 1
            fi
            grep '^== ' install-$run.log
          done

      - name: Reboot
        run: |
          set -euo pipefail
          # CI only: the ruleset drops new inbound connections, so open ssh for the runner to
          # reconnect after the reboot. Not part of the installer.
          $SSH "sudo sed -i 's/^    iif lo accept\$/&\n    tcp dport 22 accept/' /etc/nftables/bastion.nft"
          $SSH 'sudo systemctl reboot' || true
          sleep 30
          for i in $(seq 180); do $SSH true 2>/dev/null && exit 0; sleep 10; done
          echo "no ssh after reboot"; exit 1

      - name: Check
        run: $SSH 'sudo bash bastion/ubuntu/tests/check.sh'

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.arch }}
          path: "*.log"
