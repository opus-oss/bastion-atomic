# The Ubuntu port. `kernel` builds the vm kernel for Ubuntu guests as a .deb (ubuntu/kernel/build.sh).
# `test` boots Ubuntu 26.04's cloud image in QEMU, runs ubuntu/install.sh twice with that .deb (the
# second run must succeed on the already-hardened system, DNS going through dnscrypt-proxy),
# reboots into the new kernel and runs ubuntu/tests/check.sh in the guest. On main, `publish` then
# cosign-signs the tested .debs and puts them on the ubuntu-kernel release, where install.sh takes
# them from. arm64 runners have no KVM, so that leg of the test runs under TCG and is slow.
name: ubuntu

on:
  schedule:
    - cron: "0 10 * * 3"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ubuntu/**, files/**, kernel/**, Containerfile, cosign.pub, .github/workflows/ubuntu.yml]

concurrency:
  group: ubuntu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            ca-certificates curl gnupg xz-utils patch make flex bison bc python3 perl \
            clang lld llvm libelf-dev libssl-dev openssl dpkg-dev debhelper rsync cpio kmod dwarves
      - uses: actions/checkout@v4
      - name: Build
        run: bash ubuntu/kernel/build.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: out/*.deb

  test:
    needs: kernel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      IMG: ubuntu-26.04-server-cloudimg-${{ matrix.arch }}.img
      BASE: https://cloud-images.ubuntu.com/releases/resolute/release
      SSH: ssh -p 2222 -i key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ServerAliveInterval=30 -o LogLevel=ERROR ubuntu@127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: kernel-deb

      - name: Tools
        run: |
          sudo apt-get update -q
          if [ ${{ matrix.arch }} = amd64 ]; then
            sudo apt-get install -yq qemu-system-x86 qemu-utils cloud-image-utils
            sudo chmod 666 /dev/kvm
          else
            sudo apt-get install -yq qemu-system-arm qemu-efi-aarch64 qemu-utils cloud-image-utils
          fi

      - name: Cloud image
        run: |
          set -euo pipefail
          curl -fsSLO "$BASE/$IMG"
          curl -fsSL "$BASE/SHA256SUMS" | grep " \*$IMG\$" | sed 's/ \*/  /' | sha256sum -c -
          qemu-img create -f qcow2 -F qcow2 -b "$IMG" disk.qcow2 30G
          ssh-keygen -q -t ed25519 -N '' -f key
          cat > user-data <<EOF
          #cloud-config
          ssh_authorized_keys: ["$(cat key.pub)"]
          package_update: false
          EOF
          cloud-localds seed.img user-data

      - name: Boot
        run: |
          set -euo pipefail
          common=(-m 6144 -smp 4 -display none -serial file:serial.log -daemonize -pidfile qemu.pid
                  -drive file=disk.qcow2,if=virtio -drive file=seed.img,if=virtio,format=raw
                  -nic user,model=virtio-net-pci,hostfwd=tcp:127.0.0.1:2222-:22)
          if [ ${{ matrix.arch }} = amd64 ]; then
            qemu-system-x86_64 -machine q35,accel=kvm -cpu host "${common[@]}"
          else
            cp /usr/share/AAVMF/AAVMF_VARS.fd vars.fd
            qemu-system-aarch64 -machine virt -cpu max,pauth-impdef=on \
              -drive if=pflash,format=raw,readonly=on,file=/usr/share/AAVMF/AAVMF_CODE.fd \
              -drive if=pflash,format=raw,file=vars.fd "${common[@]}"
          fi
          for i in $(seq 180); do $SSH true 2>/dev/null && exit 0; sleep 10; done
          echo "no ssh after 30 minutes"; exit 1

      - name: Install (twice), reboot
        run: |
          set -euo pipefail
          deb=$(ls kernel-deb/linux-image-*.deb)
          kver=$(dpkg-deb -f "$deb" Package); echo "EXPECT_KERNEL=${kver#linux-image-}" >> "$GITHUB_ENV"
          tar c files ubuntu cosign.pub kernel-deb | $SSH 'mkdir -p bastion && tar x -C bastion'
          $SSH 'sudo cloud-init status --wait >/dev/null || true'
          # CI only: the runner reaches the guest over ssh, which the ruleset would drop. This is
          # the installer's own local-exception file, not a change to it.
          $SSH 'sudo install -D -m 0644 /dev/stdin /etc/bastion/nftables-input.nft <<< "tcp dport 22 accept"'
          # Both runs in a transient unit, so a dropped ssh session (TCG is slow) cannot kill them.
          $SSH "sudo systemd-run --unit=ci-install --setenv=BASTION_KERNEL_DEB=/home/ubuntu/bastion/$deb \
            /bin/bash -c 'cd /home/ubuntu && { bash bastion/ubuntu/install.sh > install-1.log 2>&1 && bash bastion/ubuntu/install.sh > install-2.log 2>&1; echo \$? > install.rc; }'"
          for i in $(seq 480); do $SSH 'test -e install.rc' 2>/dev/null && break; sleep 15; done
          $SSH 'cat install-1.log install-2.log 2>/dev/null' > install.log || true
          rc=$($SSH 'cat install.rc' || echo none)
          grep '^== ' install.log || true
          if [ "$rc" != 0 ]; then echo "install failed (rc=$rc)"; tail -n 60 install.log; exit 1; fi
          $SSH 'sudo systemctl reboot' || true
          sleep 30
          for i in $(seq 180); do $SSH true 2>/dev/null && exit 0; sleep 10; done
          echo "no ssh after reboot"; exit 1

      - name: Check
        run: $SSH "sudo EXPECT_KERNEL=$EXPECT_KERNEL bash bastion/ubuntu/tests/check.sh"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.arch }}
          path: "*.log"

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kernel-*
          merge-multiple: true
          path: debs
      - uses: sigstore/cosign-installer@v3
      # A plain signature over each .deb with the key the images are signed with (SIGNING_SECRET),
      # so install.sh can check it with openssl against cosign.pub, no cosign needed on the guest.
      - name: Sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          for d in debs/*.deb; do
            cosign sign-blob --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY --output-signature "$d.sig" "$d"
            base64 -d "$d.sig" > raw.sig
            openssl dgst -sha256 -verify cosign.pub -signature raw.sig "$d"
          done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=ubuntu-kernel
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --latest=false \
            --title "Ubuntu vm kernel" \
            --notes "linux-hardened, virtual hardware only, for Ubuntu 26.04 guests. Installed and kept up to date by ubuntu/install.sh, which checks each .deb's .sig against cosign.pub. Rebuilt and replaced by .github/workflows/ubuntu.yml."
          old=$(gh release view "$tag" --json assets -q '.assets[].name')
          gh release upload "$tag" debs/*.deb debs/*.deb.sig --clobber
          new=$(cd debs && ls)
          for a in $old; do grep -qxF "$a" <<<"$new" || gh release delete-asset "$tag" "$a" -y; done
