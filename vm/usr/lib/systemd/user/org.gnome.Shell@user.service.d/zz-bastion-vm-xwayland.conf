# VM image only: start GNOME Shell with Xwayland. secureblue's override.conf (in /etc) runs it with
# --no-x11, and spice-vdagent, which syncs the clipboard and display size with the host, is an X11
# client that reaches the session through Xwayland. Drop-ins apply in filename order across /etc
# and /usr, so this one, sorting last, has the final ExecStart.
[Service]
ExecStart=
ExecStart=/usr/bin/gnome-shell --mode=%i
