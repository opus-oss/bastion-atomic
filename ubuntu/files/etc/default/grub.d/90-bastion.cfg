# Kernel arguments: secureblue's 10-secureblue.toml (taken from the published bastion-atomic-vm
# image, so Ubuntu boots with what Bastion boots with) plus bastion's own 20-bastion.toml.
# Appended to whatever the installer put there. Applied by update-grub, which install.sh runs.
#
# module.sig_enforce=1: Ubuntu's own modules are signed; an unsigned DKMS module will not load.
# lockdown=confidentiality: no hibernation, no /dev/mem, no kprobes or BPF reads of kernel memory.
# rd.shell=0 / rd.emergency=halt: a failed boot halts instead of dropping to a root shell.
# x86-only arguments are ignored on arm64, as on Bastion.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT hash_pointers=always init_on_alloc=1 init_on_free=1 intel_iommu=on iommu.passthrough=0 iommu.strict=1 iommu=force kvm_amd.sev=1 kvm_amd.sev_es=1 kvm_amd.sev_snp=1 kvm-amd.nested=0 kvm-intel.nested=0 kvm-intel.vmentry_l1d_flush=always kvm.mitigate_smt_rsb=1 l1d_flush=on l1tf=full,force lockdown=confidentiality loglevel=0 mitigations=auto,nosmt module.sig_enforce=1 page_alloc.shuffle=1 proc_mem.force_override=ptrace pti=on random.trust_bootloader=off random.trust_cpu=off randomize_kstack_offset=on rd.emergency=halt rd.shell=0 slab_debug=FZ slab_nomerge spec_store_bypass_disable=on spectre_v2=on ssbd=force-on systemd.ssh_auto=no vdso32=0 vsyscall=none plymouth.enable=0"
